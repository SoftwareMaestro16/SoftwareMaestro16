<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Working from protocol to developer experience">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#6366F1;#8B5CF6;#3B82F6" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#3B82F6;#6366F1;#8B5CF6" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#8B5CF6;#6366F1;#A78BFA" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="fround">
      <rect width="1200" height="140" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fround)">
    <rect width="1200" height="140" fill="url(#fbg)"/>

    <path fill="#ffffff" fill-opacity="0.10"
          d="M0,52 C200,92 340,12 560,52 C780,92 940,22 1200,58 L1200,0 L0,0 Z">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
               values="M0,52 C200,92 340,12 560,52 C780,92 940,22 1200,58 L1200,0 L0,0 Z;
                       M0,60 C220,20 360,88 580,48 C800,14 960,84 1200,44 L1200,0 L0,0 Z;
                       M0,52 C200,92 340,12 560,52 C780,92 940,22 1200,58 L1200,0 L0,0 Z"/>
    </path>

    <path fill="#ffffff" fill-opacity="0.07"
          d="M0,32 C240,64 420,8 640,36 C860,64 1000,12 1200,38 L1200,0 L0,0 Z">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
               values="M0,32 C240,64 420,8 640,36 C860,64 1000,12 1200,38 L1200,0 L0,0 Z;
                       M0,40 C220,10 400,58 620,30 C840,6 1020,52 1200,26 L1200,0 L0,0 Z;
                       M0,32 C240,64 420,8 640,36 C860,64 1000,12 1200,38 L1200,0 L0,0 Z"/>
    </path>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0.3s" fill="freeze"/>
      <text x="600" y="108" text-anchor="middle"
            font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="17" font-weight="400" fill="#ffffff" fill-opacity="0.95">Working from protocol to developer experience</text>
    </g>
  </g>
</svg>
